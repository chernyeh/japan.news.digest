# .github/workflows/daily_edinet.yml
# Fetches EDINET's statutory filing list for the last 3 days (trailing window,
# so a transient failure self-heals on the next run) and merges it into the
# rolling data/edinet_filings.csv index that the Research tab reads.
#
# Requires an EDINET_API_KEY repo secret (free registration at
# https://disclosure2.edinet-fsa.go.jp/ — see edinet.py's module docstring).

name: Daily EDINET Filings

on:
  schedule:
    - cron: '0 21 * * *'    # 21:00 UTC = 06:00 JST next day
  workflow_dispatch:

jobs:
  fetch-edinet:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector (3-day trailing window)
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python collect_edinet.py --days 3

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/edinet_filings.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update EDINET filings index [skip ci]"
            git push
          fi
