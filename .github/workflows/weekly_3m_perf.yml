# .github/workflows/weekly_3m_perf.yml
name: Weekly 3M vs TOPIX Performance

on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  compute-3m-perf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      # compute_3m_perf.py is a file in the repo -- see daily_prices.yml.
      - name: Run compute script
        run: python3 compute_3m_perf.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jquants_3m_perf.csv
          if [ -f data/split_events.csv ]; then git add data/split_events.csv; fi
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update 3M/6M/12M performance [skip ci]"
            git push
          fi
