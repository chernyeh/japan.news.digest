# .github/workflows/daily_tdnet.yml
# Fetches TDnet timely disclosures for the last 3 days (in small chunks —
# Yanoshin's JP list endpoint isn't documented to paginate) and merges them
# into the rolling data/tdnet_filings.csv index that the Research tab reads.
# No API key needed — both TDnet sources used here are public.

name: Daily TDnet Filings

on:
  schedule:
    - cron: '30 21 * * *'    # 21:30 UTC = 06:30 JST next day (after daily_edinet.yml)
  workflow_dispatch:

jobs:
  fetch-tdnet:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run collector (3-day trailing window)
        run: python collect_tdnet.py --days 3

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tdnet_filings.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update TDnet filings index [skip ci]"
            git push
          fi
