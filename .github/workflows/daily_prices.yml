# .github/workflows/daily_prices.yml
# Fetches prices via yfinance batch download (JPX CSV blocked on GitHub Actions)
# Archives daily snapshot to data/archive/ for 3M performance calculation
# Computes market cap from prices x shares (coverage ~228 larger stocks)
name: Daily Prices and Market Cap

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests openpyxl

      - name: Write fetch script
        run: |
          cat > fetch_prices.py << 'PYEOF'
          import yfinance as yf
          import pandas as pd
          import csv
          import os
          from datetime import datetime, date, timedelta

          price_map = {}
          # yfinance returns Volume in the same frame as Close; until now
          # only Close was kept. Average daily volume is what decides how
          # long a position takes to exit, which is the input the
          # position-sizing rule needs and never had.
          vol_map = {}
          mcap_map  = {}

          # ── Load shares ───────────────────────────────────────────────────────
          shares_map = {}
          if os.path.exists("data/jquants_shares.csv"):
              with open("data/jquants_shares.csv") as f:
                  for row in csv.DictReader(f):
                      code = str(row.get("Code","")).strip().zfill(4)[:4]
                      try:
                          sh = int(float(row.get("SharesOutstanding", 0) or 0))
                          if sh > 0:
                              shares_map[code] = sh
                      except Exception:
                          pass
              print(f"Shares loaded: {len(shares_map)} companies")
          else:
              print("WARNING: jquants_shares.csv not found")

          # ── Union in codes from JPX earnings calendar ─────────────────────────
          earnings_codes = set()
          jpx_dir = "data/jpx_earnings"
          if os.path.isdir(jpx_dir):
              try:
                  import openpyxl
              except ImportError:
                  openpyxl = None
                  print("openpyxl not installed; skipping JPX earnings universe expansion")
              if openpyxl:
                  for fname in os.listdir(jpx_dir):
                      if not fname.lower().endswith(".xlsx"):
                          continue
                      try:
                          wb = openpyxl.load_workbook(
                              os.path.join(jpx_dir, fname), data_only=True, read_only=True)
                          ws = wb["List"] if "List" in wb.sheetnames else wb.active
                          for row in ws.iter_rows(min_row=6, values_only=True):
                              if not row or row[1] is None:
                                  continue
                              c = str(row[1]).strip().replace(".0", "")
                              if c.isdigit() and len(c) == 4:
                                  earnings_codes.add(c)
                      except Exception as e:
                          print(f"JPX parse error {fname}: {e}")
          print(f"Earnings calendar codes: {len(earnings_codes)}")

          # ── Load codes ────────────────────────────────────────────────────────
          # Always fetch all TSE codes so 3M perf covers the full earnings calendar
          # (3172 unique companies vs only 228 in shares_map).
          # Market cap is still computed only for companies in shares_map.
          import random
          # The JPX-Nikkei 400 backs the Research tab's forecast panel, whose
          # valuation columns are blank without a close price. The sweep below
          # is shuffled and most of the 1300-9998 range is not a listed company,
          # so leaving these to chance covered only 86 of the 400. Queue them
          # immediately after the benchmark ETFs instead: they land in the first
          # batches, before any rate-limiting bites. The range loop also cannot
          # emit the alphanumeric codes the TSE has issued since 2024 (417A,
          # 547A) — reading the list is the only way those are fetched at all.
          panel = []
          for path in ("data/universe.csv", "data/jpxnikkei400.csv"):
              if not os.path.exists(path):
                  continue
              with open(path, encoding="utf-8") as f:
                  panel += [str(r.get("Code","")).strip() for r in csv.DictReader(f)
                            if str(r.get("Code","")).strip()]
              print(f"{path}: queued first")
          panel = list(dict.fromkeys(panel))
          if panel:
              print(f"Forecast-panel codes queued first: {len(panel)}")
          else:
              print("WARNING: no universe file found; forecast-panel coverage "
                    "will be whatever the sweep happens to hit")

          # Always fetch TOPIX ETFs first so they're available for the benchmark
          TOPIX_MUST = ["1308", "1306"]
          codes = [str(i).zfill(4) for i in range(1300, 9999)]
          codes = [c for c in dict.fromkeys(codes) if c not in TOPIX_MUST]
          random.shuffle(codes)
          codes = list(dict.fromkeys(TOPIX_MUST + panel + codes))
          tickers = [c + ".T" for c in codes]
          print(f"Fetching prices for {len(tickers)} tickers...")

          # ── yfinance batch download ───────────────────────────────────────────
          BATCH = 500
          total = (len(tickers) + BATCH - 1) // BATCH
          for i in range(0, len(tickers), BATCH):
              batch = tickers[i:i+BATCH]
              n = i // BATCH + 1
              try:
                  raw = yf.download(batch, period="5d", auto_adjust=True,
                                    progress=False, group_by="ticker")
                  if not raw.empty:
                      for t in batch:
                          code = t.replace(".T","")
                          try:
                              sub = raw[t] if isinstance(raw.columns, pd.MultiIndex) else raw
                              cl = sub["Close"].dropna()
                              if not cl.empty:
                                  price_map[code] = float(cl.iloc[-1])
                              # The 5-day window is deliberate: a single day's
                              # volume is noise, and a median over the window
                              # survives one halted or untraded session.
                              if "Volume" in sub:
                                  vl = sub["Volume"].dropna()
                                  vl = vl[vl > 0]
                                  if not vl.empty:
                                      vol_map[code] = float(vl.median())
                          except Exception:
                              pass
              except Exception as e:
                  print(f"Batch {n} error: {e}")
          print(f"Prices fetched: {len(price_map)} stocks")

          # ── Compute market cap ────────────────────────────────────────────────
          for code, price in price_map.items():
              sh = shares_map.get(code)
              if sh and sh > 0 and price > 0:
                  mcap_map[code] = round((price * sh) / 1e9, 1)
          print(f"Market caps (from shares x price): {len(mcap_map)}")

          # ── Fallback: per-ticker .info for codes missing shares ──────────────
          # Earnings-calendar codes that have no shares row need a direct
          # marketCap pull. Also harvest sharesOutstanding to grow shares CSV.
          new_shares = {}
          missing = sorted(c for c in earnings_codes if c not in shares_map)
          INFO_CAP = 600  # cap per run to keep wall time bounded
          if len(missing) > INFO_CAP:
              print(f"Capping .info fallback at {INFO_CAP} of {len(missing)} missing codes")
              missing = missing[:INFO_CAP]
          print(f"Fetching .info for {len(missing)} codes without shares data...")
          for code in missing:
              try:
                  info = yf.Ticker(f"{code}.T").info or {}
                  mc = info.get("marketCap")
                  if mc and mc > 0:
                      mcap_map[code] = round(mc / 1e9, 1)
                  sh = info.get("sharesOutstanding")
                  if sh and sh > 0:
                      new_shares[code] = int(sh)
              except Exception:
                  continue
          print(f"Fallback added: mcap+{sum(1 for c in missing if c in mcap_map)}, "
                f"shares+{len(new_shares)}")

          # ── Append newly-discovered shares to jquants_shares.csv ─────────────
          if new_shares:
              today_str_sh = datetime.utcnow().strftime("%Y-%m-%d")
              header_needed = not os.path.exists("data/jquants_shares.csv")
              with open("data/jquants_shares.csv", "a", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  if header_needed:
                      w.writerow(["Code", "SharesOutstanding", "UpdatedDate"])
                  for code, sh in sorted(new_shares.items()):
                      w.writerow([code, sh, today_str_sh])
              print(f"Appended {len(new_shares)} rows to jquants_shares.csv")

          # ── Write CSV ─────────────────────────────────────────────────────────
          os.makedirs("data", exist_ok=True)
          today_str = datetime.utcnow().strftime("%Y-%m-%d")
          all_codes = sorted(set(list(price_map.keys()) + list(mcap_map.keys())))
          def _turnover(code):
              """Yen traded on a median day. Volume alone is not comparable
              across companies -- a million shares of a Y300 stock and of a
              Y30,000 stock are two very different positions to get out of."""
              px, vol = price_map.get(code), vol_map.get(code)
              return round(px * vol) if (px and vol) else ""
          rows = [[code, today_str, price_map.get(code,""), mcap_map.get(code,""),
                   round(vol_map.get(code)) if vol_map.get(code) else "", _turnover(code)]
                  for code in all_codes if price_map.get(code,"") or mcap_map.get(code,"")]
          HEADER = ["Code","Date","Close","MarketCapB","Volume","TurnoverJPY"]

          # Both readers of these files use csv.DictReader, so the two new
          # columns are invisible to anything that does not ask for them, and
          # the 187 archives written before this change stay readable.
          with open("data/jquants_prices_latest.csv","w",newline="",encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(HEADER)
              w.writerows(rows)

          mc = sum(1 for c in all_codes if mcap_map.get(c))
          print(f"Written: {len(rows)} stocks, MarketCapB: {mc} ({round(mc/max(len(rows),1)*100,1)}%)")

          # ── Archive daily snapshot ────────────────────────────────────────────
          os.makedirs("data/archive", exist_ok=True)
          archive_path = f"data/archive/prices_{today_str}.csv"
          with open(archive_path,"w",newline="",encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(HEADER)
              w.writerows(rows)
          print(f"Archived: {archive_path}")
          vn = sum(1 for r in rows if r[4] != "")
          print(f"  with volume: {vn}/{len(rows)} ({round(vn/max(len(rows),1)*100,1)}%)")

          # ── Archive the yen ───────────────────────────────────────────────────
          # market_data.py fetches USD/JPY live for the Markets tab and throws it
          # away. Nothing has ever kept a history, so no question of the form
          # "how does this company move when the yen does" could be answered at
          # all. A day not archived cannot be recovered later, so this starts now
          # even though the analysis that uses it needs months of it. ~11 KB/year.
          # The merge and write live in fx_history.py so they can be tested
          # without a network; only the fetch is here.
          import fx_history as FXH
          FX_TICKERS = {"USDJPY": "JPY=X", "EURJPY": "EURJPY=X", "CNYJPY": "CNYJPY=X"}
          fx_row = {}
          for name, tkr in FX_TICKERS.items():
              try:
                  h = yf.Ticker(tkr).history(period="5d", auto_adjust=False)
                  cl = h["Close"].dropna() if not h.empty else None
                  if cl is not None and not cl.empty:
                      fx_row[name] = round(float(cl.iloc[-1]), 4)
              except Exception as e:
                  print(f"FX {name}: {e}")
          if fx_row:
              hist = FXH.merge_fx_row(FXH.load_fx_history(), today_str, fx_row)
              FXH.write_fx_history(hist)
              print(f"FX archived {today_str}: {fx_row} ({len(hist)} rows)")
          else:
              print("FX: no rates fetched this run")

          # ── Prune the archive ─────────────────────────────────────────────────
          # Nothing has ever removed these and they accumulate about 7.5 MB a
          # year. 760 days is the retention edinet.py and tdnet.py already use,
          # so the three stores age out together, and it is comfortably longer
          # than the 12-month lookback compute_3m_perf.py needs.
          RETENTION_DAYS = 760
          cutoff = date.today() - timedelta(days=RETENTION_DAYS)
          pruned = 0
          for fname in sorted(os.listdir("data/archive")):
              if not (fname.startswith("prices_") and fname.endswith(".csv")):
                  continue
              try:
                  fdate = date.fromisoformat(fname[7:-4])
              except Exception:
                  continue
              if fdate < cutoff:
                  os.remove(os.path.join("data/archive", fname))
                  pruned += 1
          if pruned:
              print(f"Pruned {pruned} archive file(s) older than {cutoff}")

          # ── Backfill missing historical snapshots ─────────────────────────────
          # Ensures 3M/6M/12M windows are always covered so the compute script
          # can derive TOPIX benchmarks from archives instead of relying on yfinance.
          LOOKBACKS = {"3M": (91, 14), "6M": (181, 21), "12M": (365, 28)}
          today = date.today()
          existing_dates = set()
          for fname in os.listdir("data/archive"):
              if fname.startswith("prices_") and fname.endswith(".csv"):
                  try: existing_dates.add(date.fromisoformat(fname[7:-4]))
                  except Exception: pass

          backfill_targets = []
          for period, (days_ago, tolerance) in LOOKBACKS.items():
              target = today - timedelta(days=days_ago)
              covered = any(abs((d - target).days) <= tolerance for d in existing_dates)
              if not covered:
                  backfill_targets.append((period, target))
                  print(f"Backfill needed: {period} target {target}")

          for period, target in backfill_targets:
              start_str = (target - timedelta(days=5)).isoformat()
              end_str   = (target + timedelta(days=1)).isoformat()
              print(f"Backfilling {period} ({target})...")
              hist_prices = {}
              for i in range(0, len(tickers), BATCH):
                  batch = tickers[i:i+BATCH]
                  n = i // BATCH + 1
                  try:
                      raw = yf.download(batch, start=start_str, end=end_str,
                                        auto_adjust=True, progress=False, group_by="ticker")
                      if raw.empty:
                          continue
                      for t in batch:
                          code = t.replace(".T","")
                          try:
                              cl = (raw[t]["Close"] if isinstance(raw.columns, pd.MultiIndex)
                                    else raw["Close"]).dropna()
                              if not cl.empty:
                                  hist_prices[code] = float(cl.iloc[-1])
                          except Exception:
                              pass
                  except Exception as e:
                      print(f"  Backfill batch {n} error: {e}")
              if hist_prices:
                  target_str = target.isoformat()
                  bf_path = f"data/archive/prices_{target_str}.csv"
                  with open(bf_path, "w", newline="", encoding="utf-8") as f:
                      w = csv.writer(f)
                      w.writerow(["Code","Date","Close","MarketCapB"])
                      for code, price in sorted(hist_prices.items()):
                          w.writerow([code, target_str, price, ""])
                  print(f"  Backfilled {bf_path} ({len(hist_prices)} stocks)")
              else:
                  print(f"  Backfill {period}: no prices returned (market closed?)")

          # ── Delete archives older than 380 days ───────────────────────────────
          # 380-day buffer keeps 12M lookback (365d) with room for weekends/holidays
          cutoff = date.today() - timedelta(days=380)
          removed = 0
          for fname in os.listdir("data/archive"):
              if fname.startswith("prices_") and fname.endswith(".csv"):
                  try:
                      fdate = date.fromisoformat(fname[7:-4])
                      if fdate < cutoff:
                          os.remove(f"data/archive/{fname}")
                          removed += 1
                  except Exception:
                      pass
          if removed:
              print(f"Cleaned {removed} archives older than {cutoff}")
          PYEOF

      - name: Run fetch script
        run: python fetch_prices.py

      # compute_3m_perf.py is a file in the repo (it used to be written out
      # here as a heredoc, and had drifted from the weekly job's copy). It
      # split-adjusts the returns and writes data/split_events.csv.
      - name: Run 3M/6M/12M perf script
        run: python compute_3m_perf.py

      # Reduces the archive to one row per company, so the app can show average
      # daily turnover and days-to-exit without ever loading a time series.
      - name: Compute liquidity summary
        run: python compute_liquidity.py

      # Measured FX sensitivity, as opposed to the translation figure a company
      # discloses. No-ops until the FX archive above has ~30 paired observations.
      - name: Compute FX beta
        run: python compute_fx_beta.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only what exists. `git add` on a missing pathspec is fatal,
          # not a warning, and under `bash -e` that would throw away the whole
          # run -- data/fx_beta.csv is absent until the FX archive has enough
          # history to regress, which is weeks away on a fresh repo.
          # -A on the archive directory so the prune's deletions are staged too.
          git add -A data/archive/ || true
          for f in data/jquants_prices_latest.csv data/jquants_shares.csv \
                   data/jquants_3m_perf.csv data/split_events.csv data/liquidity.csv \
                   data/fx_history.csv data/fx_beta.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update daily prices, market cap, and 3M perf [skip ci]"
            git push
          fi
